name: Build LIFE RP Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Localizar pasta do projeto (package.json)
        run: |
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" -not -path "*/.*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "ERRO: package.json não encontrado no repositório!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Garantir arquivo de entrada src/main.tsx
        run: |
          mkdir -p "$PROJECT_DIR/src"
          if [ ! -f "$PROJECT_DIR/src/main.tsx" ]; then
            cat << 'EOF' > "$PROJECT_DIR/src/main.tsx"
         import React from 'react';
         import ReactDOM from 'react-dom/client';
         import App from './App';
         import './index.css';

         ReactDOM.createRoot(document.getElementById('root')!).render(
         <React.StrictMode>
         <App />
         </React.StrictMode>
          );
          EOF
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar Android SDK sem prompt interativo
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" | head -n 1)
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Instalar dependências e buildar Web/Capacitor
        run: |
          cd "$PROJECT_DIR"
          npm install
          npm run build
          npx cap add android
          npx cap sync android

      - name: Compilar APK Debug
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: LIFE-RP-Android-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
