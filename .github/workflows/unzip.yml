name: Descompactar LIFE RP ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip-project:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair ZIP e limpar arquivo compactado
        run: |
          unzip -o LIFE-RP-Brasilia-3D.zip
          rm -f LIFE-RP-Brasilia-3D.zip

      - name: Salvar arquivos extraídos no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Descompacta projeto LIFE RP Brasilia 3D"
          git push
      
